name: Setup GitHub Pages
on: push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PYTHON: ""
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v2

      - name: Check out the sibling phase-space dependency
        run: |
          git clone https://github.com/mmikhasenko/xDDPhaseSpace.jl.git ../xDDPhaseSpace.jl
          git -C ../xDDPhaseSpace.jl checkout 3590e02cda1d2366b9d2e32fc9342fde4ef7d44c

      - name: Install Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'

      - name: Cache Julia artifacts & such
        uses: julia-actions/cache@v1
        with:
          cache-registries: "true"

      # We set up a folder that Pluto can use to cache exported notebooks. If the notebook file did not change, then Pluto can take the exported file from cache instead of running the notebook.
      - name: Set up notebook state cache
        uses: actions/cache@v4
        with:
          path: pluto_state_cache
          key: ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}-${{ hashFiles('**/*jl') }}
          restore-keys: |
            ${{ runner.os }}-pluto_state_cache-v2-${{ hashFiles('**/Project.toml', '**/Manifest.toml', '.github/workflows/*' ) }}

      - name: Run & export Pluto notebooks
        run: |
          julia -e 'using Pkg
            Pkg.activate(mktempdir())
            Pkg.add([
              Pkg.PackageSpec(name="PlutoSliderServer", version="1"),
            ])

            import PlutoSliderServer

            PlutoSliderServer.github_action(".";
              Export_cache_dir="pluto_state_cache",
              Export_baked_notebookfile=false,
              Export_baked_state=false,
            )'

      - name: Update README.md and convert to index.html, add CSS
        run: |
          julia notebooks/list_notebooks.jl
          sudo apt-get install pandoc
          pandoc README.md -s -o README.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: .
          single-commit: true
