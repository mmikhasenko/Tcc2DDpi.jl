name: Publish static documentation
on:
  push:
    branches: [master]
    paths: [public-site/**, website/**, notebooks/**, .github/workflows/pages.yaml]
  pull_request:
    paths: [public-site/**, website/**, notebooks/**, .github/workflows/pages.yaml]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site
        run: python3 website/check.py public-site --complete

  deploy:
    needs: static-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: public-site
          single-commit: true
