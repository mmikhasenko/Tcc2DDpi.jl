name: Publish static documentation
on:
  push:
    branches: [master]
    paths: [website/**, notebooks/**, .github/workflows/pages.yaml]
  pull_request:
    paths: [website/**, notebooks/**, .github/workflows/pages.yaml]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation dependencies
        run: julia --project=website -e 'using Pkg; Pkg.instantiate()'
      - name: Build and verify documentation
        run: julia --project=website website/build.jl
      - name: Stage the verified site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: public-site
          include-hidden-files: true

  deploy:
    needs: build-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: public-site
      - uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages
          folder: public-site
          single-commit: true
